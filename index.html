<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>DMP3 AR Experience</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-environment-component/dist/aframe-environment-component.min.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
    canvas.a-canvas, .a-canvas { touch-action: none !important; }
    .hidden { display:none !important; }

    .btn {
      position: fixed; bottom:20px; left:20px;
      width:70px; height:70px;
      background:#1e5df8; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      z-index:1000; cursor:pointer;
      box-shadow:0 8px 24px rgba(30,93,248,0.35);
      pointer-events:auto;
    }
    .btn svg { width:34px; height:34px; fill:white; }

    .cta-pill {
      position:fixed; left:50%; bottom:20px; transform:translateX(-50%);
      background:#1e5df8; color:#fff;
      padding:14px 22px; border-radius:30px;
      font-size:16px; font-weight:600;
      z-index:1000; pointer-events:auto;
      box-shadow:0 8px 24px rgba(30,93,248,0.35);
    }

    #resetModelBtn_p2, #restartVideoBtn_p1 {
      position:fixed; top:20px; left:20px;
      background:#1e5df8; padding:10px 14px;
      border-radius:30px; color:#fff; font-weight:600;
      z-index:1000; cursor:pointer;
      box-shadow:0 8px 24px rgba(30,93,248,0.35);
    }

    #closeBtn {
      position:fixed; top:20px; right:20px;
      width:55px; height:55px; border-radius:50%;
      background:rgba(0,0,0,0.7); color:white;
      font-size:26px; line-height:55px; text-align:center;
      z-index:1000; cursor:pointer;
    }

    #audioOverlay {
      position:fixed; inset:0;
      background:rgba(0,0,0,0.85);
      display:flex; align-items:center; justify-content:center;
      font-size:22px; color:white;
      z-index:2000; cursor:pointer;
      padding:24px; text-align:center;
    }
  </style>
</head>

<body>

  <a-scene
    mindar-image="imageTargetSrc: ./assets/targets.mind; filterMinCF:0.0001; filterBeta:0.001;"
    vr-mode-ui="enabled:false"
    device-orientation-permission-ui="enabled:true">

    <a-assets>
      <video id="videoAsset" src="./assets/video.mp4" preload="auto" crossorigin="anonymous" playsinline></video>
      <audio id="voiceAsset" src="./assets/quantum-voiceover.mp3" preload="auto" crossorigin="anonymous"></audio>
    </a-assets>

    <!-- ⭐ PRELOAD MODEL (loads immediately when page opens) -->
    <a-entity id="preloadModel"
              gltf-model="./assets/quantum-model-shaded.glb"
              visible="false">
    </a-entity>

    <!-- Lighting -->
    <a-entity light="type: ambient; intensity: 1.2;"></a-entity>
    <a-entity light="type: directional; intensity: 1.2; position: 0 1 1"></a-entity>
    <a-entity environment="preset: dawn; lighting: flat; ground:none; dressing:none; grid:none;"></a-entity>

    <a-camera look-controls="enabled:false"></a-camera>

    <!-- Poster 1 -->
    <a-entity mindar-image-target="targetIndex: 0" id="targetP1">
      <a-video id="arVideo" src="#videoAsset" width="1.6" height="0.9" visible="false"></a-video>
    </a-entity>

    <!-- Poster 2 -->
    <a-entity mindar-image-target="targetIndex: 1" id="targetP2">
      <a-entity id="modelRig"
                position="0 -0.05 0"
                rotation="0 0 0"
                scale="0.7 0.7 0.7"
                visible="false">

        <!-- ⭐ MAIN MODEL referencing same file as preload (instant load) -->
        <a-entity id="modelEntity"
                  gltf-model="./assets/quantum-model-shaded.glb">
        </a-entity>

      </a-entity>
    </a-entity>

  </a-scene>

  <!-- UI -->
  <div id="playVideoCTA_p1" class="cta-pill hidden">Play video</div>
  <div id="restartVideoBtn_p1" class="hidden">Restart video</div>

  <div id="togglePlayPauseBtn_p1" class="btn hidden">
    <svg id="iconPlay_p1" viewBox="0 0 100 100"><polygon points="30,20 80,50 30,80"></polygon></svg>
    <svg id="iconPause_p1" style="display:none;" viewBox="0 0 100 100">
      <rect x="25" y="20" width="18" height="60"></rect>
      <rect x="57" y="20" width="18" height="60"></rect>
    </svg>
  </div>

  <div id="tellMeMoreBtn_p2" class="cta-pill hidden">Tell me more</div>

  <div id="togglePlayPauseBtn_p2" class="btn hidden">
    <svg id="iconPlay_p2" viewBox="0 0 100 100"><polygon points="30,20 80,50 30,80"></polygon></svg>
    <svg id="iconPause_p2" style="display:none;" viewBox="0 0 100 100">
      <rect x="25" y="20" width="18" height="60"></rect>
      <rect x="57" y="20" width="18" height="60"></rect>
    </svg>
  </div>

  <div id="resetModelBtn_p2" class="hidden">Reset model</div>

  <div id="modelLoading_p2" class="cta-pill hidden">Loading model…</div>
  <div id="retryModel_p2" class="cta-pill hidden">Retry model</div>

  <div id="closeBtn" class="hidden">✕</div>
  <div id="audioOverlay">Tap to Enable Sound</div>

  <script>
    AFRAME.registerComponent('touch-transform', {
      schema:{rotateFactor:{default:0.01}, minScale:{default:0.2}, maxScale:{default:3}},
      init() {
        this.drag=false; this.pinch=null;
        this.s=this.el.object3D.scale.x;
        this.x=0; this.y=0;

        const f=e=>e.target.closest('.btn, .cta-pill, #audioOverlay, #resetModelBtn_p2, #restartVideoBtn_p1');
        const dist=(a,b)=>Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);

        window.addEventListener('touchstart',e=>{
          if(!this.el.object3D.visible||f(e))return;
          if(e.touches.length===1){this.drag=true;this.x=e.touches[0].clientX;this.y=e.touches[0].clientY;}
          if(e.touches.length===2){this.pinch=dist(e.touches[0],e.touches[1]);this.s=this.el.object3D.scale.x;}
        },{passive:false});

        window.addEventListener('touchmove',e=>{
          if(!this.el.object3D.visible||f(e))return;
          if(e.touches.length===2&&this.pinch){
            let ratio=dist(e.touches[0],e.touches[1])/this.pinch;
            let s=Math.min(Math.max(this.s*ratio,this.data.minScale),this.data.maxScale);
            this.el.object3D.scale.set(s,s,s);
            e.preventDefault();return;
          }
          if(this.drag&&e.touches.length===1){
            let dx=e.touches[0].clientX-this.x, dy=e.touches[0].clientY-this.y;
            this.x=e.touches[0].clientX; this.y=e.touches[0].clientY;
            let r=this.el.object3D.rotation;
            r.y+=dx*this.data.rotateFactor; r.x+=dy*this.data.rotateFactor;
            r.x=Math.max(-Math.PI/2,Math.min(Math.PI/2,r.x));
            e.preventDefault();
          }
        },{passive:false});

        window.addEventListener('touchend',()=>{this.drag=false;this.pinch=null;},{passive:false});
      }
    });

    window.onload = () => {

      const video=document.querySelector('#videoAsset');
      const arVideo=document.querySelector('#arVideo');
      const voice=document.querySelector('#voiceAsset');

      const modelRig=document.querySelector('#modelRig');
      const modelEntity=document.querySelector('#modelEntity');

      const targetP1=document.querySelector('#targetP1');
      const targetP2=document.querySelector('#targetP2');

      const playCTA=document.getElementById('playVideoCTA_p1');
      const playBtnP1=document.getElementById('togglePlayPauseBtn_p1');
      const iconPlayP1=document.getElementById('iconPlay_p1');
      const iconPauseP1=document.getElementById('iconPause_p1');

      const restartVideoBtn=document.getElementById('restartVideoBtn_p1');

      const tellCTA=document.getElementById('tellMeMoreBtn_p2');
      const playBtnP2=document.getElementById('togglePlayPauseBtn_p2');

      const resetBtn=document.getElementById('resetModelBtn_p2');
      const closeBtn=document.getElementById('closeBtn');

      const audioOverlay=document.getElementById('audioOverlay');

      const modelLoading=document.getElementById('modelLoading_p2');
      const retryModel=document.getElementById('retryModel_p2');

      let modelReady=false;
      let pending=false;

      let defaultScale=null, defaultRot=null;

      const show=e=>e.classList.remove('hidden');
      const hide=e=>e.classList.add('hidden');

      function updateVideo(){
        iconPlayP1.style.display = video.paused ? 'block' : 'none';
        iconPauseP1.style.display = video.paused ? 'none' : 'block';
      }
      function updateVoice(){
        iconPlayP2.style.display = voice.paused ? 'block' : 'none';
        iconPauseP2.style.display = voice.paused ? 'none' : 'block';
      }

      audioOverlay.addEventListener('click',()=>{
        video.muted=false; voice.muted=false;
        video.play().then(()=>video.pause());
        voice.play().then(()=>voice.pause());
        audioOverlay.style.display='none';
      });

      /* Preloaded model loaded immediately */
      /* Now main modelEntity will load instantly from cache */

      modelEntity.addEventListener('model-loaded',(e)=>{
        const THREE=AFRAME.THREE;
        const obj=e.detail.model||modelEntity.getObject3D('mesh');
        if(obj){
          const box=new THREE.Box3().setFromObject(obj);
          const c=new THREE.Vector3();
          box.getCenter(c); obj.position.sub(c);
        }
        modelReady=true;
        hide(modelLoading); hide(retryModel);

        if(pending){ modelRig.setAttribute('visible',true); pending=false; }
      });

      modelEntity.addEventListener('model-error',()=>{
        hide(modelLoading); show(retryModel);
      });

      retryModel.addEventListener('click',()=>{
        hide(retryModel); show(modelLoading);
        const bust="./assets/quantum-model-shaded.glb?v="+Date.now();
        modelEntity.setAttribute('gltf-model',bust);
        modelReady=false; pending=true;
      });

      /* POSTER 1 */
      targetP1.addEventListener('targetFound',()=>{
        voice.pause(); voice.currentTime=0;
        arVideo.setAttribute('visible',true);

        show(playCTA); hide(playBtnP1);
        show(restartVideoBtn); show(closeBtn);

        hide(tellCTA); hide(playBtnP2); hide(resetBtn);
        hide(modelLoading); hide(retryModel);
      });

      targetP1.addEventListener('targetLost',()=>{
        video.pause();
        arVideo.setAttribute('visible',false);
        hide(playCTA); hide(playBtnP1); hide(restartVideoBtn); hide(closeBtn);
      });

      playCTA.addEventListener('click',()=>{
        video.play().then(()=>{ hide(playCTA); show(playBtnP1); updateVideo(); });
      });

      playBtnP1.addEventListener('click',()=>{
        if(video.paused) video.play(); else video.pause();
        updateVideo();
      });

      restartVideoBtn.addEventListener('click',()=>{
        video.pause(); video.currentTime=0; video.play(); updateVideo();
      });

      /* POSTER 2 */
      targetP2.addEventListener('targetFound',()=>{
        video.pause();

        if(modelReady){
          modelRig.setAttribute('visible',true);
          hide(modelLoading);
        } else {
          pending=true;
          show(modelLoading);
        }

        defaultScale=modelRig.object3D.scale.clone();
        defaultRot=modelRig.object3D.rotation.clone();

        show(tellCTA); hide(playBtnP2);
        show(resetBtn); show(closeBtn);

        hide(playCTA); hide(playBtnP1); hide(restartVideoBtn);
      });

      targetP2.addEventListener('targetLost',()=>{
        voice.pause(); voice.currentTime=0;
        modelRig.setAttribute('visible',false);
        pending=false;
        hide(tellCTA); hide(playBtnP2); hide(resetBtn);
        hide(closeBtn); hide(modelLoading); hide(retryModel);
      });

      tellCTA.addEventListener('click',()=>{
        voice.play().then(()=>{ hide(tellCTA); show(playBtnP2); updateVoice(); });
      });

      playBtnP2.addEventListener('click',()=>{
        if(voice.paused) voice.play(); else voice.pause();
        updateVoice();
      });

      resetBtn.addEventListener('click',()=>{
        modelRig.object3D.scale.copy(defaultScale);
        modelRig.object3D.rotation.set(defaultRot.x,defaultRot.y,defaultRot.z);
      });

      closeBtn.addEventListener('click',()=>{
        video.pause(); voice.pause();
        arVideo.setAttribute('visible',false);
        modelRig.setAttribute('visible',false);
        hide(playCTA); hide(playBtnP1); hide(restartVideoBtn);
        hide(tellCTA); hide(playBtnP2); hide(resetBtn);
        hide(modelLoading); hide(retryModel); hide(closeBtn);
      });

    };
  </script>

</body>
</html>
