<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>DMP3 AR Experience</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />

  <!-- A-Frame + MindAR + Environment (HDRI) -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-environment-component/dist/aframe-environment-component.min.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }

    /* Ensure touch gestures reach WebGL canvas */
    canvas.a-canvas, .a-canvas { touch-action: none !important; }

    /* Circular play/pause buttons */
    .btn {
      position: fixed;
      bottom: 20px;
      left: 20px;
      width: 70px;
      height: 70px;
      background: #1e5df8;
      border-radius: 50%;
      z-index: 1000;
      user-select: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(30, 93, 248, 0.35);
      transition: transform 0.1s ease;
      touch-action: manipulation;
      pointer-events: auto;
    }
    .btn:active { transform: scale(0.96); }
    .btn svg { width: 34px; height: 34px; fill: white; }

    /* Pill CTAs (center-bottom) */
    .cta-pill {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 20px;
      background: #1e5df8;
      color: #fff;
      border-radius: 30px;
      padding: 14px 22px;
      font-size: 16px;
      font-weight: 600;
      z-index: 1000;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 8px 24px rgba(30, 93, 248, 0.35);
      white-space: nowrap;
      pointer-events: auto;
      touch-action: manipulation;
    }

    /* Top-left pills (Restart video / Reset model) */
    #resetModelBtn_p2,
    #restartVideoBtn_p1 {
      position: fixed;
      top: 20px;
      left: 20px;
      background: #1e5df8;
      color: #fff;
      border-radius: 30px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      z-index: 1000;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 8px 24px rgba(30, 93, 248, 0.35);
      white-space: nowrap;
      pointer-events: auto;
      touch-action: manipulation;
    }

    .hidden { display: none !important; }

    /* Close button */
    #closeBtn {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 55px;
      height: 55px;
      background: rgba(0,0,0,0.7);
      color: white;
      font-size: 26px;
      text-align: center;
      line-height: 55px;
      border-radius: 50%;
      z-index: 1000;
      cursor: pointer;
      pointer-events: auto;
      user-select: none;
      touch-action: manipulation;
    }

    /* Audio unlock overlay */
    #audioOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      z-index: 2000;
      cursor: pointer;
      pointer-events: auto;
      padding: 24px;
      text-align: center;
    }

    @media (max-width: 420px) {
      .btn { width: 62px; height: 62px; }
      .btn svg { width: 28px; height: 28px; }
      #closeBtn { width: 48px; height: 48px; font-size: 22px; line-height: 48px; }
      .cta-pill { padding: 12px 18px; font-size: 15px; }
      #resetModelBtn_p2, #restartVideoBtn_p1 { padding: 9px 12px; font-size: 13px; }
    }
  </style>
</head>

<body>

  <!-- =================== AR SCENE =================== -->
  <a-scene
    mindar-image="imageTargetSrc: ./assets/targets.mind; filterMinCF: 0.0001; filterBeta: 0.001;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true">

    <a-assets>
      <!-- Poster 1 video -->
      <video id="videoAsset"
             src="./assets/video.mp4"
             preload="auto"
             playsinline
             crossorigin="anonymous"></video>

      <!-- Poster 2 model -->
      <a-asset-item id="modelAsset"
                    src="./assets/quantum-model-shaded.glb"
                    crossorigin="anonymous"></a-asset-item>

      <!-- Poster 2 voiceover -->
      <audio id="voiceAsset"
             src="./assets/quantum-voiceover.mp3"
             preload="auto"
             crossorigin="anonymous"></audio>
    </a-assets>

    <!-- Basic lighting (kept) -->
    <a-entity light="type: ambient; intensity: 1.2"></a-entity>
    <a-entity light="type: directional; intensity: 1.2; position: 0 1 1"></a-entity>

    <!-- HDRI-style environment reflections for PBR -->
    <a-entity environment="preset: dawn; lighting: flat; ground: none; playArea: 0; fog: 0; grid: none; dressing: none"></a-entity>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Poster 1 -->
    <a-entity mindar-image-target="targetIndex: 0" id="targetP1">
      <a-video id="arVideo"
               src="#videoAsset"
               width="1.6"
               height="0.9"
               position="0 0 0"
               visible="false"></a-video>
    </a-entity>

    <!-- Poster 2 -->
    <a-entity mindar-image-target="targetIndex: 1" id="targetP2">
      <!-- RIG receives user transforms (rotate/scale) -->
      <a-entity id="modelRig"
                position="0 -0.05 0"
                rotation="0 0 0"
                scale="0.7 0.7 0.7"
                visible="false">
        <!-- Child is the actual GLB; pivot recentred on model-loaded -->
        <a-entity id="modelEntity" gltf-model="#modelAsset"></a-entity>
      </a-entity>
    </a-entity>

  </a-scene>

  <!-- =================== UI =================== -->

  <!-- Poster 1 -->
  <div id="playVideoCTA_p1" class="cta-pill hidden">Play video</div>
  <div id="restartVideoBtn_p1" class="hidden">Restart video</div>

  <div id="togglePlayPauseBtn_p1" class="btn hidden" role="button" aria-label="Play/Pause video">
    <svg id="iconPlay_p1" viewBox="0 0 100 100"><polygon points="30,20 80,50 30,80"></polygon></svg>
    <svg id="iconPause_p1" style="display:none;" viewBox="0 0 100 100">
      <rect x="25" y="20" width="18" height="60"></rect>
      <rect x="57" y="20" width="18" height="60"></rect>
    </svg>
  </div>

  <!-- Poster 2 -->
  <div id="tellMeMoreBtn_p2" class="cta-pill hidden">Tell me more</div>

  <div id="togglePlayPauseBtn_p2" class="btn hidden" role="button" aria-label="Play/Pause audio">
    <svg id="iconPlay_p2" viewBox="0 0 100 100"><polygon points="30,20 80,50 30,80"></polygon></svg>
    <svg id="iconPause_p2" style="display:none;" viewBox="0 0 100 100">
      <rect x="25" y="20" width="18" height="60"></rect>
      <rect x="57" y="20" width="18" height="60"></rect>
    </svg>
  </div>

  <div id="resetModelBtn_p2" class="hidden">Reset model</div>

  <!-- Loading & Retry for Poster 2 model -->
  <div id="modelLoading_p2" class="cta-pill hidden">Loading model…</div>
  <div id="retryModel_p2"  class="cta-pill hidden">Retry model</div>

  <!-- Shared -->
  <div id="closeBtn" class="hidden">✕</div>
  <div id="audioOverlay">Tap to Enable Sound</div>

  <!-- =================== SCRIPT =================== -->
  <script>
    /* Touch-transform: 1-finger rotate, 2-finger pinch-scale; ignore UI touches */
    AFRAME.registerComponent('touch-transform', {
      schema:{rotateFactor:{default:0.01}, minScale:{default:0.2}, maxScale:{default:3}},
      init(){
        this.isDragging=false;
        this.prevX=0; this.prevY=0;
        this.pinchStartDist=null;
        this.startScale=this.el.object3D.scale.x;

        this._boundStart=e=>this._start(e);
        this._boundMove=e=>this._move(e);
        this._boundEnd=e=>this._end(e);

        window.addEventListener('touchstart',this._boundStart,{passive:false});
        window.addEventListener('touchmove',this._boundMove,{passive:false});
        window.addEventListener('touchend',this._boundEnd,{passive:false});
        window.addEventListener('touchcancel',this._boundEnd,{passive:false});
      },
      remove(){
        window.removeEventListener('touchstart',this._boundStart);
        window.removeEventListener('touchmove',this._boundMove);
        window.removeEventListener('touchend',this._boundEnd);
        window.removeEventListener('touchcancel',this._boundEnd);
      },
      _visible(){ return this.el.object3D.visible; },
      _isUI(t){ return t && t.closest && t.closest('.btn, .cta-pill, #closeBtn, #audioOverlay, #resetModelBtn_p2, #restartVideoBtn_p1'); },
      _start(e){
        if(!this._visible() || this._isUI(e.target)) return;

        if(e.touches.length===1){
          this.isDragging=true;
          this.prevX=e.touches[0].clientX;
          this.prevY=e.touches[0].clientY;
          e.preventDefault();
        } else if(e.touches.length===2){
          this.pinchStartDist=this._dist(e.touches[0],e.touches[1]);
          this.startScale=this.el.object3D.scale.x;
          e.preventDefault();
        }
      },
      _move(e){
        if(!this._visible() || this._isUI(e.target)) return;

        if(e.touches.length===2 && this.pinchStartDist){
          const d=this._dist(e.touches[0],e.touches[1]);
          let s=this.startScale*(d/this.pinchStartDist);
          s=Math.min(Math.max(s,this.data.minScale),this.data.maxScale);
          this.el.object3D.scale.set(s,s,s);
          e.preventDefault(); return;
        }

        if(this.isDragging && e.touches.length===1){
          const x=e.touches[0].clientX, y=e.touches[0].clientY;
          const dx=x-this.prevX, dy=y-this.prevY;
          this.prevX=x; this.prevY=y;
          const rot=this.el.object3D.rotation;
          rot.y+=dx*this.data.rotateFactor;
          rot.x+=dy*this.data.rotateFactor;
          const maxX=Math.PI/2, minX=-Math.PI/2;
          if(rot.x>maxX)rot.x=maxX;
          if(rot.x<minX)rot.x=minX;
          e.preventDefault();
        }
      },
      _end(e){
        if(!this._visible())return;
        if(e.touches.length<2){
          this.pinchStartDist=null;
          this.startScale=this.el.object3D.scale.x;
        }
        if(e.touches.length===0)this.isDragging=false;
      },
      _dist(t0,t1){
        const dx=t0.clientX-t1.clientX, dy=t0.clientY-t1.clientY;
        return Math.hypot(dx,dy);
      }
    });

    window.onload = () => {
      /* Elements */
      const video = document.querySelector('#videoAsset');
      const arVideo = document.querySelector('#arVideo');
      const voice = document.querySelector('#voiceAsset');

      const modelRig = document.querySelector('#modelRig');
      const modelEntity = document.querySelector('#modelEntity');
      const modelAsset = document.querySelector('#modelAsset');

      const targetP1 = document.querySelector('#targetP1');
      const targetP2 = document.querySelector('#targetP2');

      const playCTA = document.getElementById('playVideoCTA_p1');
      const playBtnP1 = document.getElementById('togglePlayPauseBtn_p1');
      const iconPlayP1 = document.getElementById('iconPlay_p1');
      const iconPauseP1 = document.getElementById('iconPause_p1');

      const restartVideoBtn = document.getElementById('restartVideoBtn_p1');

      const tellCTA = document.getElementById('tellMeMoreBtn_p2');
      const playBtnP2 = document.getElementById('togglePlayPauseBtn_p2');
      const iconPlayP2 = document.getElementById('iconPlay_p2');
      const iconPauseP2 = document.getElementById('iconPause_p2');

      const resetBtnP2 = document.getElementById('resetModelBtn_p2');
      const closeBtn = document.getElementById('closeBtn');
      const audioOverlay = document.getElementById('audioOverlay');

      const modelLoading = document.getElementById('modelLoading_p2');
      const retryModel = document.getElementById('retryModel_p2');

      /* Attach touch-transform once */
      modelRig.setAttribute('touch-transform','minScale:0.2; maxScale:3; rotateFactor:0.01');

      /* Model load state */
      let modelReady = false;
      let pendingShowModel = false;

      /* Loading UI control */
      let modelLoadTimeoutId = null;
      const MODEL_LOAD_TIMEOUT_MS = 10000;

      const show = el => el && el.classList.remove('hidden');
      const hide = el => el && el.classList.add('hidden');

      function showModelLoading() {
        if (modelLoadTimeoutId) clearTimeout(modelLoadTimeoutId);
        show(modelLoading);
        hide(retryModel);
        modelLoadTimeoutId = setTimeout(() => {
          hide(modelLoading);
          show(retryModel);
          console.warn('[model] load taking long – offering retry');
        }, MODEL_LOAD_TIMEOUT_MS);
      }

      function hideModelLoading() {
        if (modelLoadTimeoutId) clearTimeout(modelLoadTimeoutId);
        modelLoadTimeoutId = null;
        hide(modelLoading);
        hide(retryModel);
      }

      /* Pivot recenter + ready gate */
      modelEntity.addEventListener('model-loaded', (e) => {
        const THREE = AFRAME.THREE;
        const obj = e.detail.model || modelEntity.getObject3D('mesh');
        if (obj) {
          const box = new THREE.Box3().setFromObject(obj);
          const center = new THREE.Vector3();
          box.getCenter(center);
          obj.position.sub(center);
        }

        modelReady = true;
        hideModelLoading();

        if (pendingShowModel) {
          modelRig.setAttribute('visible', true);
          pendingShowModel = false;
        }
      });

      modelEntity.addEventListener('model-error', (e) => {
        console.error('[model] load error', e.detail);
        pendingShowModel = false;
        hide(modelLoading);
        show(retryModel);
      });

      /* Play/Pause icon updates */
      function updateP1() {
        const paused = video.paused;
        iconPlayP1.style.display = paused ? 'block' : 'none';
        iconPauseP1.style.display = paused ? 'none' : 'block';
      }
      function updateP2() {
        const paused = voice.paused;
        iconPlayP2.style.display = paused ? 'block' : 'none';
        iconPauseP2.style.display = paused ? 'none' : 'block';
      }

      /* Audio unlock */
      audioOverlay.addEventListener('click', () => {
        video.muted = false;
        voice.muted = false;
        video.play().then(() => video.pause()).catch(()=>{});
        voice.play().then(() => voice.pause()).catch(()=>{});
        audioOverlay.style.display = 'none';
      });

      /* Active poster tracker */
      let active = null;

      /* Default transforms for Reset */
      let defaultRigScale = null, defaultRigRot = null;

      /* ============== Poster 1 ============== */
      targetP1.addEventListener('targetFound', () => {
        active = 'p1';

        voice.pause(); voice.currentTime = 0;
        arVideo.setAttribute('visible', true);

        show(playCTA);
        hide(playBtnP1);

        show(restartVideoBtn);
        show(closeBtn);

        /* Hide P2 UI */
        hide(tellCTA); hide(playBtnP2); hide(resetBtnP2);
        hideModelLoading(); hide(retryModel);
      });

      targetP1.addEventListener('targetLost', () => {
        video.pause();
        arVideo.setAttribute('visible', false);

        hide(playCTA); hide(playBtnP1);
        hide(restartVideoBtn);
        hide(closeBtn);

        active = null;
      });

      playCTA.addEventListener('click', () => {
        video.play().then(() => {
          hide(playCTA);
          show(playBtnP1);
          updateP1();
        }).catch(()=>{});
      });

      document.getElementById('togglePlayPauseBtn_p1').addEventListener('click', () => {
        if (video.paused) video.play().catch(()=>{}); else video.pause();
        updateP1();
      });

      restartVideoBtn.addEventListener('click', () => {
        video.pause();
        video.currentTime = 0;
        video.play().catch(()=>{});
        updateP1();
      });

      /* ============== Poster 2 ============== */
      targetP2.addEventListener('targetFound', () => {
        active = 'p2';

        /* Stop P1 */
        video.pause();

        /* Auto-show model when ready; show loader meanwhile */
        if (modelReady) {
          modelRig.setAttribute('visible', true);
          hideModelLoading();
        } else {
          pendingShowModel = true;
          showModelLoading();
        }

        /* Capture defaults for Reset (as first scanned) */
        defaultRigScale = modelRig.object3D.scale.clone();
        defaultRigRot = modelRig.object3D.rotation.clone();

        /* UI: Tell me more visible immediately; hide audio play/pause until playing */
        show(tellCTA);
        hide(playBtnP2);

        /* Show Reset + Close */
        show(resetBtnP2);
        show(closeBtn);

        /* Hide P1 UI */
        hide(playCTA); hide(playBtnP1); hide(restartVideoBtn);
      });

      targetP2.addEventListener('targetLost', () => {
        voice.pause(); voice.currentTime = 0;

        modelRig.setAttribute('visible', false);
        pendingShowModel = false;

        hide(tellCTA); hide(playBtnP2); hide(resetBtnP2);
        hide(closeBtn);

        hideModelLoading(); hide(retryModel);

        active = null;
      });

      /* "Tell me more" → start voiceover */
      tellCTA.addEventListener('click', () => {
        voice.play().then(() => {
          hide(tellCTA);
          show(playBtnP2);
          updateP2();
        }).catch(()=>{});
      });

      /* Voiceover play/pause */
      document.getElementById('togglePlayPauseBtn_p2').addEventListener('click', () => {
        if (voice.paused) voice.play().catch(()=>{}); else voice.pause();
        updateP2();
      });

      /* Reset model */
      resetBtnP2.addEventListener('click', () => {
        modelRig.object3D.scale.copy(defaultRigScale);
        modelRig.object3D.rotation.set(defaultRigRot.x, defaultRigRot.y, defaultRigRot.z);
      });

      /* Retry model load if it stalled or errored */
      retryModel.addEventListener('click', () => {
        hide(retryModel);
        show(modelLoading);

        /* Cache-bust the asset and reattach */
        const srcUrl = modelAsset.getAttribute('src');
        const bust = (srcUrl.includes('?') ? '&' : '?') + 'v=' + Date.now();
        modelAsset.setAttribute('src', srcUrl + bust);

        modelEntity.setAttribute('gltf-model', '#modelAsset');

        modelReady = false;
        pendingShowModel = true;

        /* Re-arm loader timeout */
        if (modelLoadTimeoutId) clearTimeout(modelLoadTimeoutId);
        modelLoadTimeoutId = setTimeout(() => {
          hide(modelLoading);
          show(retryModel);
          console.warn('[model] retry still taking long');
        }, MODEL_LOAD_TIMEOUT_MS);
      });

      /* Close (context-aware) */
      closeBtn.addEventListener('click', () => {
        if (active === 'p1') {
          video.pause(); video.currentTime = 0;
          arVideo.setAttribute('visible', false);
          hide(playCTA); hide(playBtnP1); hide(restartVideoBtn);
        }
        if (active === 'p2') {
          voice.pause(); voice.currentTime = 0;
          modelRig.setAttribute('visible', false);
          hide(tellCTA); hide(playBtnP2); hide(resetBtnP2);
          hideModelLoading(); hide(retryModel);
          pendingShowModel = false;
        }
        hide(closeBtn);
        active = null;
      });

      /* Initial UI state */
      hide(playCTA); hide(playBtnP1); hide(restartVideoBtn);
      hide(tellCTA); hide(playBtnP2); hide(resetBtnP2);
      hide(closeBtn);
      hide(modelLoading); hide(retryModel);
    };
  </script>

</body>
</html>
